name: Java Tiberbu CI and GHCR Push

on:
  push:
    branches: [ "demo-tiberbu" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_URI: ghcr.io/${{ github.repository }}
  # Branch-scoped incremental release tags: demo-tiberbu-v1, demo-tiberbu-v2, ... (one new tag per
  # successful build). demo-dev owns v<N> and latest, which the dev deployment pulls.
  VERSION_TAG_PREFIX: demo-tiberbu-v
  LATEST_TAG: demo-tiberbu-latest

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Determine next version tag
      id: version
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        OWNER="${{ github.repository_owner }}"
        PKG="${{ github.event.repository.name }}"
        PREFIX="${VERSION_TAG_PREFIX}"
        TAGS=$(gh api "/orgs/${OWNER}/packages/container/${PKG}/versions?per_page=100" \
          --jq '.[].metadata.container.tags[]' 2>/dev/null | grep -E "^${PREFIX}[0-9]+$" || true)
        if [ -z "$TAGS" ]; then
          VERSION_TAG="${PREFIX}1"
        else
          MAX_NUM=$(echo "$TAGS" | sed "s/^${PREFIX}//" | sort -n | tail -1)
          VERSION_TAG="${PREFIX}$((MAX_NUM + 1))"
        fi
        echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
        echo "Version tag for this build: ${VERSION_TAG}"

    - name: Build with Gradle
      run: ./gradlew build -x generateJooq

    # Built from the repository Dockerfile (non-root user, wget HEALTHCHECK on /actuator/health).
    # bootBuildImage on Spring Boot 3.4.4 calls Docker API 1.24, which the runner's Docker 29
    # rejects ("client version 1.24 is too old").
    - name: Build container image
      run: docker build -t ${IMAGE_URI}:${{ steps.version.outputs.version_tag }} .

    - name: Tag image as latest
      run: docker tag ${IMAGE_URI}:${{ steps.version.outputs.version_tag }} ${IMAGE_URI}:${LATEST_TAG}

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push version and latest to GHCR
      run: |
        VERSION_TAG="${{ steps.version.outputs.version_tag }}"
        docker push ${IMAGE_URI}:${VERSION_TAG}
        docker push ${IMAGE_URI}:${LATEST_TAG}
