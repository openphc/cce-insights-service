plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.4'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'org.sonarqube' version '6.3.1.5724'
    id 'nu.studer.jooq' version '9.0'
}

group = 'org.openphc.cce'
version = '1.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Database — ClickHouse
    implementation 'com.clickhouse:clickhouse-jdbc:0.8.3'
    runtimeOnly 'org.apache.httpcomponents.client5:httpclient5'

    // jOOQ
    implementation 'org.springframework.boot:spring-boot-starter-jooq'
    jooqGenerator 'com.clickhouse:clickhouse-jdbc:0.8.3'
    jooqGenerator 'org.apache.httpcomponents.client5:httpclient5'
    jooqGenerator 'org.slf4j:slf4j-simple:2.0.13'

    // Spring Data Commons (Page / Pageable — no JPA required)
    implementation 'org.springframework.data:spring-data-commons'

    // JPA API only — provides EntityNotFoundException used in services/controllers
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'

    // Observability
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

    // Caching
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Integration test source set
sourceSets {
    integrationTest {
        java.srcDir 'src/integrationTest/java'
        resources.srcDir 'src/integrationTest/resources'
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    integrationTestImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('processIntegrationTestResources') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('integrationTest', Test) {
    description = 'Runs integration tests.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    shouldRunAfter test
}

check.dependsOn integrationTest

test {
    useJUnitPlatform()
}

tasks.named('integrationTest') {
    useJUnitPlatform()
}

jacocoTestReport {
    // Both suites contribute: integrationTest is wired into check, so it runs
    // on every build. Reading only test.exec would discard everything it covers.
    dependsOn test, integrationTest
    executionData.setFrom(fileTree(layout.buildDirectory).include('jacoco/*.exec'))
    reports {
        xml.required = true      // the format Sonar ingests
        html.required = true     // for local browsing
    }
    // jOOQ generates thousands of lines into src/generated/jooq, which is wired
    // into sourceSets.main. Left in, generated classes outnumber hand-written
    // ones and drag the coverage ratio into single digits.
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['org/openphc/cce/insights/jooq/**'])
        }))
    }
}

sonar {
    properties {
        property 'sonar.organization', 'openphc'
        property 'sonar.projectKey', 'openphc_cce-insights-service'
        property 'sonar.coverage.jacoco.xmlReportPaths',
                 "${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml"
        // Generated jOOQ sources: analysing them yields issues nobody can act
        // on, since any fix is overwritten by the next generateJooq run.
        property 'sonar.exclusions', 'src/generated/**'
        property 'sonar.coverage.exclusions', 'src/generated/**'
    }
}

tasks.named('sonar') {
    dependsOn jacocoTestReport
}

// ── jOOQ code generation ──────────────────────────────────────────────────────
// Run: ./gradlew generateJooq
// Requires a running ClickHouse on localhost:8123.
// Re-run whenever the ClickHouse schema changes (ALTER TABLE, new tables, etc.)
jooq {
    version = '3.19.22'
    edition = nu.studer.gradle.jooq.JooqEdition.OSS

    configurations {
        main {
            generationTool {
                logging = org.jooq.meta.jaxb.Logging.WARN
                jdbc {
                    driver   = 'com.clickhouse.jdbc.ClickHouseDriver'
                    url      = 'jdbc:clickhouse://localhost:8123/cce_analytics'
                    user     = 'cce_pipeline'
                    password = 'cce_analytics_dev'
                }
                generator {
                    name = 'org.jooq.codegen.JavaGenerator'
                    database {
                        name        = 'org.jooq.meta.jdbc.JDBCDatabase'
                        inputSchema = 'cce_analytics'
                    }
                    generate {
                        records                  = false
                        pojos                    = false
                        daos                     = false
                        springAnnotations        = false
                        validationAnnotations    = false
                        jpaAnnotations           = false
                        deprecationOnUnknownTypes = false
                    }
                    target {
                        packageName = 'org.openphc.cce.insights.jooq'
                        directory   = 'src/generated/jooq'
                    }
                }
            }
        }
    }
}

sourceSets.main.java.srcDir 'src/generated/jooq'
